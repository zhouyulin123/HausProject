name: quality

on:
  push:
  pull_request:

jobs:
  real-world-proof-requirement:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装发布证明验签依赖
        run: python -m pip install "cryptography>=42.0.0"
      - name: 分类是否需要受保护发布证明
        id: classify
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python -m evals.release_change_detection \
            --repo-root . \
            --base-ref "$CHANGE_BASE" \
            --head-ref "$CHANGE_HEAD" \
            --detect-only \
            --output .test_artifacts/real-world-proof-requirement.json
          required="$(jq -er '.change_detection.required' \
            .test_artifacts/real-world-proof-requirement.json)"
          echo "required=$required" >> "$GITHUB_OUTPUT"

      - name: 获取当前提交的受保护发布证明
        if: github.event_name == 'pull_request' && steps.classify.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          runs_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/real-world-release-gate.yml/runs?event=workflow_dispatch&status=success&head_sha=${TARGET_SHA}&per_page=100")"
          run_id="$(jq -er --arg sha "$TARGET_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch" and .conclusion == "success")] | sort_by(.run_started_at) | last | .id' \
            <<< "$runs_json")"
          artifact_name="real-world-release-proof-${TARGET_SHA}"
          artifacts_json="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          artifact_id="$(jq -er --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)] | sort_by(.created_at) | last | .id' \
            <<< "$artifacts_json")"
          proof_zip="$RUNNER_TEMP/real-world-release-proof.zip"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > "$proof_zip"
          unzip -q -j "$proof_zip" "real_world_release_proof.json" \
            -d "$RUNNER_TEMP"

      - name: 验证敏感变更发布证明
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CHANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          REAL_WORLD_RELEASE_PROOF_PUBLIC_KEY_B64: ${{ vars.REAL_WORLD_RELEASE_PROOF_PUBLIC_KEY_B64 }}
          REAL_WORLD_RELEASE_PROOF_KEY_ID: ${{ vars.REAL_WORLD_RELEASE_PROOF_KEY_ID }}
          REAL_WORLD_RELEASE_PROOF_MAX_AGE_SECONDS: ${{ vars.REAL_WORLD_RELEASE_PROOF_MAX_AGE_SECONDS || '604800' }}
          PYTHONPATH: backend
        run: >-
          python -m evals.release_change_detection
          --repo-root .
          --base-ref "$CHANGE_BASE"
          --head-ref "$CHANGE_HEAD"
          --proof-file "$RUNNER_TEMP/real-world-release-proof.json"
          --output .test_artifacts/real-world-proof-requirement.json

  backend:
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m compileall -q backend/app
      - run: python -m evals.run_open_geometry_eval --output .test_artifacts/open_geometry_eval.json
      - run: python -m pytest -p no:cacheprovider

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
